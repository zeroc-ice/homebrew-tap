name: brew audit

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Weekly run to catch upstream URL breakage and Homebrew behavior changes
  # between pushes, since the audit checks online resources.
  schedule:
    - cron: "23 14 * * 1"

permissions:
  contents: read

jobs:
  audit:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup tap
        uses: ./.github/actions/setup-tap

      - name: Audit formulae
        run: brew audit --formula --tap zeroc-ice/tap --online --strict --git

      - name: Audit casks
        run: brew audit --cask --tap zeroc-ice/tap --online --strict --git
