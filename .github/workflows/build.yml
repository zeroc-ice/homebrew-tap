name: build

on:
  push:
    branches: [main]
  pull_request:
    # `labeled` so adding the bottle label starts a run rather than waiting
    # for the next push.
    types: [opened, synchronize, reopened, labeled]
    branches: [main]
    paths:
      - "Formula/*.rb"

permissions:
  contents: read

# Cancel in-progress runs when a new commit is pushed to the same PR
concurrency:
  group: ${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  detect:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read # for gh pr diff
    outputs:
      formulae: ${{ steps.changed.outputs.formulae }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # On PRs, only build formulae that were modified.
      # On push to main, build all formulae.
      - name: Detect formulae
        id: changed
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            # Only build formulae modified in the PR
            formulae=$(gh pr diff "${{ github.event.pull_request.number }}" --name-only \
              | grep '^Formula/' \
              | sed 's|Formula/||; s|\.rb$||' \
              | jq -R -s -c 'split("\n") | map(select(length > 0))')
          else
            # Build all formulae on push
            formulae=$(printf '%s\n' Formula/*.rb \
              | sed 's|Formula/||; s|\.rb$||' \
              | jq -R -s -c 'split("\n") | map(select(length > 0))')
          fi
          echo "formulae=$formulae" >> "$GITHUB_OUTPUT"
        env:
          GH_TOKEN: ${{ github.token }}

  build:
    needs: detect
    if: needs.detect.outputs.formulae != '[]'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        formula: ${{ fromJson(needs.detect.outputs.formulae) }}
        os: [macos-15, macos-26]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup tap
        uses: ./.github/actions/setup-tap

      # --build-bottle keeps the install relocatable so the same build can be
      # bottled below; it is otherwise a source build.
      - name: Install ${{ matrix.formula }}
        run: brew install --verbose --build-bottle zeroc-ice/tap/${{ matrix.formula }}

      - name: Test ${{ matrix.formula }}
        run: brew test zeroc-ice/tap/${{ matrix.formula }}

      # Bottling is opt-in per pull request: a formula that ships bottles
      # declares where they are hosted, and the label says this is the PR that
      # should produce them.
      - name: Bottle ${{ matrix.formula }}
        id: bottle
        if: contains(github.event.pull_request.labels.*.name, 'bottle')
        env:
          FORMULA: ${{ matrix.formula }}
        run: |
          root_url=$(sed -n 's/.*root_url "\(.*\)".*/\1/p' "Formula/${FORMULA}.rb")
          if [ -z "$root_url" ]; then
            echo "Formula/${FORMULA}.rb declares no root_url; not bottling."
            exit 0
          fi

          brew bottle --json --root-url="$root_url" "zeroc-ice/tap/${FORMULA}"

          # Homebrew names the file `formula--version`; the hosted layout uses a
          # single dash. See https://github.com/orgs/Homebrew/discussions/4541
          for file in *--*.bottle*.tar.gz; do
            mv "$file" "${file/--/-}"
          done

          shasum -a 256 ./*.bottle.tar.gz
          echo "bottled=true" >> "$GITHUB_OUTPUT"

      - name: Upload bottle
        if: steps.bottle.outputs.bottled == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: bottle-${{ matrix.formula }}-${{ matrix.os }}
          path: |
            *.bottle.tar.gz
            *.bottle.json
          if-no-files-found: error
